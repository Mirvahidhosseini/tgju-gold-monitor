name: DEGEN Swing Signal Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */4 * * *"

concurrency:
  group: degen-swing-signal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Analyse DEGEN/USD and send signal if needed
        env:
          BOT_TOKEN: \${{ secrets.BOT_TOKEN }}
          CHAT_ID: \${{ secrets.CHAT_ID }}
        run: python degen_signal.py

      - name: Save paper-trading state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add degen_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DEGEN signal state"
            git pull --rebase origin main
            git push
          fi
