name: DEGEN Multi-Strategy Paper Trading

on:
  push:
    paths:
      - 'degen_multi_paper.py'
      - '.github/workflows/degen_multi_paper.yml'
  workflow_dispatch:
  schedule:
    - cron: "23 */4 * * *"

concurrency:
  group: degen-multi-paper-trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade requests
      - name: Run three paper portfolios and send Telegram comparison
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python degen_multi_paper.py
      - name: Save paper state and report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add degen_multi_paper_state.json degen_multi_paper_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DEGEN multi-strategy paper trading"
            git pull --rebase origin main
            git push
          fi
