name: DEGEN Strategy Lab

on:
  push:
    paths:
      - 'degen_strategy_lab.py'
      - '.github/workflows/degen_strategy_lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strategy-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - name: Run candidate strategy backtests
        run: python degen_strategy_lab.py
      - name: Commit strategy comparison report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add degen_strategy_lab_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Add DEGEN strategy lab report"
            git pull --rebase origin main
            git push
          fi
