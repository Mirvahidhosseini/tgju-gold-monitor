name: Validate monitor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile gold_monitor.py

      - name: Validate JSON data files
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('last_price.json', 'price_history.json')]"

      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = [part.split("</script>", 1)[0] for part in html.split("<script>")[1:]]
          Path("/tmp/dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/dashboard.js
