name: DEGEN 365-day Backtest

on:
  push:
    paths:
      - 'degen_backtest.py'
      - '.github/workflows/degen_backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - name: Run one-year historical backtest
        run: python degen_backtest.py
      - name: Commit backtest report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add degen_backtest_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Add DEGEN 365-day backtest report"
            git pull --rebase origin main
            git push
          fi
